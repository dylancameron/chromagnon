<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Color study</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e5512f'/%3E%3C/svg%3E">
	<!-- A colorful page to pick from in store screenshots. Our own artwork, so
	     the listing doesn't show anyone else's site. Same layout on every load. -->
	<style>
		html, body { margin: 0; height: 100%; overflow: hidden; background: #f4ecdc; }
		main {
			display: grid;
			grid-template-columns: repeat(6, 1fr);
			grid-auto-rows: calc(100vw / 6);
		}
		.t { position: relative; overflow: hidden; background: var(--bg); }
		.t::after { content: ""; position: absolute; background: var(--fg); transform: rotate(var(--r)); }
		.circle::after { inset: 14%; border-radius: 50%; }
		.dot::after { inset: 32%; border-radius: 50%; }
		.quarter::after { inset: 0; border-radius: 0 0 100% 0; }
		.leaf::after { inset: 0; border-radius: 0 100%; }
		.half::after { left: 0; right: 0; bottom: 0; height: 50%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; transform-origin: 50% 0; }
		.stripe::after { left: 0; right: 0; top: 33%; height: 34%; }
	</style>
</head>
<body>
	<main></main>
	<script>
		const colors = ["#f4ecdc", "#e5512f", "#f2b134", "#1f8a8a", "#2742d6", "#f28cb1", "#17131f", "#9cc5a1"];
		const shapes = ["circle", "quarter", "half", "leaf", "stripe", "dot", "quarter", "half"];
		// Seeded, so every reshoot gets the same composition.
		let seed = 7;
		const rand = () => {
			seed = (seed * 16807) % 2147483647;
			return seed / 2147483647;
		};
		const pick = (list) => list[Math.floor(rand() * list.length)];
		const main = document.querySelector("main");
		for (let i = 0; i < 36; i++) {
			const bg = pick(colors);
			let fg = pick(colors);
			while (fg === bg) fg = pick(colors);
			const tile = document.createElement("div");
			tile.className = `t ${pick(shapes)}`;
			tile.style.cssText = `--bg:${bg};--fg:${fg};--r:${pick([0, 90, 180, 270])}deg`;
			main.append(tile);
		}
	</script>
</body>
</html>
